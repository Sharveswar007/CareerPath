name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # npm ci uses the committed package-lock.json for reproducible installs.
      # Installs clean with no peer-dep flags: @types/node@^22 satisfies vitest@5.
      # (Vercel's plain npm install uses this same path.)
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (errors only; legacy warnings are documented in eslint.config.mjs)
        run: npx eslint . --max-warnings 200

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          GROQ_API_KEY: placeholder-key
