services:
  careerpath:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # compose substitutes from the .env file (Copy-Item .env.campus .env)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: careerpath-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
