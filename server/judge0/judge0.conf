# Judge0 configuration (trimmed for CareerPath server on Windows + WSL2)
# Any setting not listed here falls back to Judge0's documented defaults.

# --- Required service wiring (defaults for the vendored docker-compose.yml) ---
REDIS_HOST=redis
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0

# --- Passwords (REQUIRED, cannot be blank). Change before exposing publicly. ---
REDIS_PASSWORD=Judge0RedisPass123!
POSTGRES_PASSWORD=Judge0DbPass123!

# --- Required for Windows WSL2 (cgroups v2) sandboxing ---
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# --- Keep API simple for the app ---
ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true

# --- API authentication (REQUIRED: this API is exposed to the campus LAN) ---
# All requests must send header:  X-Auth-Token: <AUTHN_TOKEN>
# The app sends it automatically when JUDGE0_AUTH_TOKEN is set in its environment.
# This value MUST stay IDENTICAL to JUDGE0_AUTH_TOKEN in the app's .env.local.
# server\campus-setup.ps1 replaced this placeholder with a fresh private token
# when .env.campus.local is present at the repo root.
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=campus-local-please-rotate-me
